# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true

reviews:
  path_instructions:
    # SSH-tillit och autentisering.
    - path: "Android/app/src/main/kotlin/se/denied/bastion/ssh/BastionSshSession.kt"
      instructions: |
        När värdnyckelkontroll eller autentisering ändras, kontrollera
        att TOFU fortfarande skiljer första anslutningen från en ändrad
        nyckel för samma värd och port. En ändrad nyckel ska avvisas.
        Kontrollera även separata kommandon, SFTP och varje ProxyJump-led
        där dessa anslutningsvägar finns.
        På Android ska läs-, tolknings- och skrivfel i known_hosts
        avvisa anslutningen, inte aktivera AcceptAllServerKeyVerifier.
        Vid ändrad agentvidarebefordran, kontrollera att användarens
        uttryckliga forwardAgent-val fortfarande styr åtkomsten.

    # Samtidighet och anslutningars livstid.
    - path: "Android/app/src/main/kotlin/se/denied/bastion/ssh/BastionSshSession.kt"
      instructions: |
        När anslutning, keepalive eller stängning ändras, följ samtidiga
        connect-, kanalöppnings- och close-förlopp samt autentiseringsfel.
        Kontrollera att promises och continuations fullbordas högst
        en gång och att fel eller stängning inte lämnar anrop väntande.
        Kontrollera att sent färdiga anslutningar och kanaler stängs
        om anroparen redan har avbrutit.
        En gammal keepalive-monitor får inte stänga en ny session.
        Använd TerminalTeardownRaceTests, AuthFailureTerminationTests
        och respektive plattforms sessionstester som regressionsunderlag.

    # Publicering av versioner.
    - path: ".github/{workflows/release.yml,scripts/semantic_release.py,scripts/wait_for_checks.py,release-baseline,release-required-checks}"
      instructions: |
        När releasebeslut eller kontrollgrind ändras, kontrollera
        att tagg, kontroller och publicering avser samma target_sha.
        Saknade, väntande eller misslyckade obligatoriska kontroller
        får inte räknas som godkända. Kontrollera paginering och
        senaste resultat per kontroll och utfärdare vid omkörningar.
        Vid samtidiga releaser eller omförsök, kontrollera att en
        befintlig taggs mål verifieras och att samma release inte
        publiceras på nytt med annat innehåll.
        Kontrollera stabila versioner, rc och promote mot parsern
        och befintliga releaseankare utan att kringgå kontrollgrinden.
